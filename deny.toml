[advisories]
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
skip = [
    # gix-pack currently requires hashbrown 0.16 while the rest of gix uses 0.17.
    { name = "hashbrown", version = "0.16.1" },
    # clap and the Criterion dependency graph currently resolve different syn lines.
    { name = "syn", version = "2.0.119" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "CC0-1.0",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
