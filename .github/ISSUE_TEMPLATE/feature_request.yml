name: Feature request
description: Propose a focused improvement to BranchSense
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Proposals should fit the documented
        architecture and roadmap.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or engineering problem would this solve?
      placeholder: Describe the use case and why it matters.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction
      description: What would you like BranchSense to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches or workarounds have you considered?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, links, or related issues.
