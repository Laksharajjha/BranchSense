[workspace]
members = [
    "crates/branchsense-core",
    "crates/branchsense-cli",
    "crates/branchsense-parser",
    "crates/branchsense-language",
    "crates/branchsense-java",
    "crates/branchsense-semantic",
    "crates/branchsense-extractor-java",
    "crates/branchsense-graph",
    "crates/branchsense-query",
    "crates/branchsense-index",
    "crates/branchsense-diff",
    "crates/branchsense-git",
]
default-members = ["crates/branchsense-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha"
edition = "2024"
rust-version = "1.85"
authors = ["BranchSense Contributors"]
license = "Apache-2.0"
repository = "https://github.com/Laksharajjha/BranchSense"
homepage = "https://github.com/Laksharajjha/BranchSense"
documentation = "https://github.com/Laksharajjha/BranchSense/tree/main/docs"
readme = "README.md"
keywords = ["git", "semantic-analysis", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
clap = { version = "4.5.53", features = ["derive"] }
criterion = "0.5.1"
gix = { version = "0.74.1", default-features = false, features = ["revision"] }
petgraph = "0.8.3"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
tempfile = "3.14.0"
tree-sitter = "0.26.11"
tree-sitter-java = "0.23.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.dev]
debug = 1

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
